<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>גלריה — מוסדות קאזניץ</title>
  <meta name="theme-color" content="#f5ead8">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand" aria-label="מוסדות קאזניץ — לעמוד הבית">
      <span class="brand-mark"><img src="assets/img/logo.jpg" alt="" width="46" height="46"></span>
      <span class="brand-name">מוסדות קאזניץ</span>
    </a>
    <nav class="site-nav" aria-label="ניווט ראשי">
      <a href="index.html#galleries" class="btn btn-ghost">כל הגלריות</a>
      <a href="index.html#contact" class="btn btn-primary">יצירת קשר</a>
    </nav>
  </header>

  <main>
    <section class="g-head">
      <a href="index.html#galleries" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        כל הגלריות
      </a>
      <span class="tag tag-accent-2" id="g-date"></span>
      <h1 class="g-title" id="g-title"></h1>
      <p class="g-meta" id="g-meta"></p>
    </section>

    <section class="gallery" id="g-photos" aria-label="תמונות">
      <div class="masonry" id="masonry" data-shape="rounded"></div>
    </section>

    <section class="video" id="g-videos" aria-labelledby="video-title">
      <div class="section-head">
        <span class="tag tag-accent">וידאו</span>
        <h2 id="video-title" class="section-title">רגעים בתנועה</h2>
      </div>
      <div class="video-grid" id="video-grid"></div>
    </section>

    <nav class="g-nav" aria-label="מעבר בין גלריות">
      <a id="g-newer" class="g-nav-link g-nav-newer" href="#">
        <small>הגלריה החדשה יותר</small><span></span>
      </a>
      <a id="g-older" class="g-nav-link g-nav-older" href="#">
        <small>הגלריה הקודמת</small><span></span>
      </a>
    </nav>
  </main>

  <footer id="contact" class="site-footer">
    <div class="footer-brand">
      <span class="footer-mark"><img src="assets/img/logo.jpg" alt="" width="60" height="60"></span>
      <div class="footer-text">
        <span class="footer-name">מוסדות קאזניץ</span>
        <span class="footer-tagline">בנשיאות כ״ק מרן אדמו״ר שליט״א</span>
      </div>
    </div>
    <a href="index.html#galleries" class="btn btn-primary">לרשימת הגלריות</a>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="תצוגת תמונה" hidden>
    <button type="button" class="lb-btn lb-close" data-lb-close aria-label="סגירה">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button type="button" class="lb-btn lb-prev" data-lb-prev aria-label="התמונה הקודמת">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <figure class="lb-figure">
      <img id="lb-image" src="" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button type="button" class="lb-btn lb-next" data-lb-next aria-label="התמונה הבאה">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
  </div>

  <script src="data/galleries.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
